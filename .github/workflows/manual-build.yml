name: 🛠️ Build Artifact

# Manually triggered — choose a platform, get a downloadable build artifact.
# Artifacts are retained for 7 days.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - macos-arm64
          - macos-intel
          - linux

jobs:
  # ── Resolve which matrix entry to run ──────────────────────────────────────
  setup:
    runs-on: ubuntu-22.04
    outputs:
      runner:  ${{ steps.cfg.outputs.runner }}
      target:  ${{ steps.cfg.outputs.target }}
      args:    ${{ steps.cfg.outputs.args }}
      label:   ${{ steps.cfg.outputs.label }}
    steps:
      - name: Resolve build config
        id: cfg
        run: |
          case "${{ github.event.inputs.platform }}" in
            windows)
              echo "runner=windows-latest"       >> $GITHUB_OUTPUT
              echo "target=x86_64-pc-windows-msvc" >> $GITHUB_OUTPUT
              echo "args="                        >> $GITHUB_OUTPUT
              echo "label=Windows-x86_64"         >> $GITHUB_OUTPUT
              ;;
            macos-arm64)
              echo "runner=macos-latest"          >> $GITHUB_OUTPUT
              echo "target=aarch64-apple-darwin"  >> $GITHUB_OUTPUT
              echo "args=--target aarch64-apple-darwin" >> $GITHUB_OUTPUT
              echo "label=macOS-arm64"            >> $GITHUB_OUTPUT
              ;;
            macos-intel)
              echo "runner=macos-latest"          >> $GITHUB_OUTPUT
              echo "target=x86_64-apple-darwin"   >> $GITHUB_OUTPUT
              echo "args=--target x86_64-apple-darwin" >> $GITHUB_OUTPUT
              echo "label=macOS-x86_64"           >> $GITHUB_OUTPUT
              ;;
            linux)
              echo "runner=ubuntu-22.04"          >> $GITHUB_OUTPUT
              echo "target=x86_64-unknown-linux-gnu" >> $GITHUB_OUTPUT
              echo "args="                        >> $GITHUB_OUTPUT
              echo "label=Linux-x86_64"           >> $GITHUB_OUTPUT
              ;;
          esac

  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    needs: setup
    runs-on: ${{ needs.setup.outputs.runner }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Get commit info
        id: meta
        shell: bash
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "msg=$(git log -1 --pretty=%s)"     >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ (needs.setup.outputs.runner == 'macos-latest') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: needs.setup.outputs.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf unzip

      - name: Install frontend dependencies
        run: npm ci

      - name: Download FFmpeg sidecars
        shell: bash
        run: node scripts/download-ffmpeg.cjs ${{ needs.setup.outputs.target }}

      - name: Verify sidecar binaries
        shell: bash
        run: ls -lh src-tauri/bin/

      - name: Build app
        run: npm run tauri build -- ${{ needs.setup.outputs.args }}

      - name: Upload Windows installer (.msi + setup.exe)
        if: needs.setup.outputs.runner == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: KenichiConverter-${{ needs.setup.outputs.label }}-${{ steps.meta.outputs.sha }}
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS installer (.dmg)
        if: needs.setup.outputs.runner == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: KenichiConverter-${{ needs.setup.outputs.label }}-${{ steps.meta.outputs.sha }}
          retention-days: 7
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Linux installers (.AppImage + .deb)
        if: needs.setup.outputs.runner == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: KenichiConverter-${{ needs.setup.outputs.label }}-${{ steps.meta.outputs.sha }}
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Build summary
        shell: bash
        run: |
          echo "## ⚡ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | ${{ needs.setup.outputs.label }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ steps.meta.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Message | ${{ steps.meta.outputs.msg }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Download the artifact from the **Artifacts** section above. Expires in 7 days." >> $GITHUB_STEP_SUMMARY
